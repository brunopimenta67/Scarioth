services:
  redis:
    image: redis:7.4-alpine
    container_name: scarioth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: scarioth-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - scarioth_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  scarioth:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scarioth-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-scarioth}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-wss://data-stream.binance.vision}
      KRAKEN_WS_URL: ${KRAKEN_WS_URL:-wss://ws.kraken.com/v2}
      MONITORED_PAIRS: ${MONITORED_PAIRS:-BTCUSDT,ETHUSDT,SOLUSDT}
      MIN_SPREAD_PERCENTAGE: ${MIN_SPREAD_PERCENTAGE:-0.01}
      ARBITRAGE_LOCK_TTL_SECONDS: ${ARBITRAGE_LOCK_TTL_SECONDS:-3}
      MAX_TICK_AGE_MS: ${MAX_TICK_AGE_MS:-5000}

volumes:
  scarioth_mongo_data:
